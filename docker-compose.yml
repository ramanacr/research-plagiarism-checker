version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: research_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_attention
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: research_web
    restart: unless-stopped
    environment:
      - RESEARCH_ATTENTION_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/research_attention
      - EMBEDDING_MODEL_NAME=all-mpnet-base-v2
      - SPACY_MODEL_NAME=en_core_web_trf
      - HF_HOME=/app/model_cache
      - SCOPUS_API_KEY=${SCOPUS_API_KEY:-00e42429e6cffa7ef063df41c9940575}
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: research_worker
    restart: unless-stopped
    environment:
      - RESEARCH_ATTENTION_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/research_attention
      - EMBEDDING_MODEL_NAME=all-mpnet-base-v2
      - SPACY_MODEL_NAME=en_core_web_trf
      - HF_HOME=/app/model_cache
      - SCOPUS_API_KEY=${SCOPUS_API_KEY:-00e42429e6cffa7ef063df41c9940575}
    depends_on:
      - db
    command: python -m src.attention.worker


volumes:
  pgdata:
